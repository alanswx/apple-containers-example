name: Container examples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross:
    name: Cross-compile ARMv7 (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: armv7-unknown-linux-gnueabihf
      - name: Build cross image
        run: >-
          docker build --platform linux/amd64
          --tag apple-containers-example-cross:local
          --file containers/cross/Containerfile .
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Cross-compile
        run: cross build --locked --release --target armv7-unknown-linux-gnueabihf
      - uses: actions/upload-artifact@v7
        with:
          name: armv7-example
          path: target/armv7-unknown-linux-gnueabihf/release/apple-containers-example
          if-no-files-found: error

  quartus:
    name: Compile Cyclone V example (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      QUARTUS_ACCEPT_EULA: "1"
      # Intel's original 17.0.0 URLs now return 403; point these repository
      # variables at a private mirror. Empty values use the Intel URLs.
      QUARTUS_17_0_RUN_URL: ${{ vars.QUARTUS_17_0_RUN_URL }}
      QUARTUS_17_0_CYCLONEV_QDZ_URL: ${{ vars.QUARTUS_17_0_CYCLONEV_QDZ_URL }}
    steps:
      - uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: false
          remove-android: false
          remove-haskell: false
          remove-codeql: false
          remove-docker-images: true
      - uses: actions/checkout@v7
      - name: Install Quartus Lite 17.0
        run: scripts/quartus-docker.sh
      - name: Compile the frozen inputs
        run: scripts/quartus-build.sh docker
      - uses: actions/upload-artifact@v7
        with:
          name: quartus-example
          path: |
            fpga/output_files/example.rbf
            fpga/output_files/build-manifest.txt
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
          if-no-files-found: error
